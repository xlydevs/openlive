# openlive config: ~/.config/openlive/config.toml (Windows: %APPDATA%\openlive\config.toml)
# Everything is optional.

# lang = "es"                 # en | es (default: your locale)
# refresh = 60                # seconds between automatic refreshes (min 15)

# Video player. Default: the first one found of mpv, IINA, VLC.
# player = "mpv"              # mpv | iina | vlc | or a full path to the executable
# player_args = ""             # extra arguments for the player
# player_ui = "openlive"      # mpv only. openlive: its own mpv setup (control bar, chat, rewind). plain: your mpv config
# chat = true                 # mpv: open Twitch streams with the chat sidebar showing (c toggles it)
# rewind = true               # mpv: open Twitch/Kick/YouTube so you can go back to before you joined
# rewind_cache_mb = 1024      # mpv: memory kept to go back in what you already watched
# quality = "best"            # streamlink quality: best, 1080p60, 720p60, 480p, audio_only…
# low_latency = true

# Browse tab: only streams in this language (ISO 639-1 code)
# browse_language = "es"

# Use your own Twitch app instead of openlive's (create a "Public" app at
# https://dev.twitch.tv/console/apps/create, redirect http://localhost)
# client_id = "your-client-id"

# Platforms shown (chosen on first run; change them with p in the app)
# [platforms]
# enabled = ["twitch", "kick", "youtube"]

# YouTube: optional Data API key. Without it openlive reads each channel's /live page.
# With it, the check is one cheap API call. Enable "YouTube Data API v3" at
# https://console.cloud.google.com/apis/library/youtube.googleapis.com and create a key.
# [youtube]
# api_key = "your-key"
# Your own Google client for the sign-in (type "TVs and Limited Input devices", YouTube Data API v3 on)
# client_id = "…apps.googleusercontent.com"
# client_secret = "GOCSPX-…"
